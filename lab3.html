<!DOCTYPE html>
<html lang= "en">
<head>
    <title>Contact Form with Inline Calculator</title>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
</head>
<body>
    <div>
        <header>
            <h1>Interactive Form with Inline Calculator</h1>
        <span>Connecting your ideas with real results.</span>
        </header>
    </div>
    <br>
    <div>
        <form method="get">
            <h2>Contact Form</h2>
            <label for = "email"> Email Address : </label>
            <input type = "email" id = "email" name = "email" required> <br><br>

            <label for = "contactdate">Contact Date : </label>
            <input type = "date" id = "contactdate" name = "contactdate" required> <br><br>

            <label for = "satisfaction">Satisfaction Level : </label>
            <input type = "range" id = "satisfaction" name = "satisfaction" min="1" max="10" value="5"><br><br>
        </form>
    </div>
    <br>
    <div>
            <button type="submit">Submit Form</button>
    </div>
    <br>
    <div>
        <hr>
        <form oninput = "result.value = parseInt(firstnum1.value) + parseInt(secondnum1.value)">
            <h2>Calculator (+)</h2>
            <label>Enter First Number : </label>
            <input type = "number" id = "firstnum1" name = "firstnum1" required value = "30"><br><br>
            <label>Enter Second Number : </label>
            <input type = "number" id = "secondnum1" name = "secondnum1" required value = "10"><br><br>
            <label> Output : </label>
            <output name = "result" for = "firstnum1 secondnum1">40</output><br>
        </form>
        <hr>
        <form oninput = "result.value = parseInt(firstnum2.value) - parseInt(secondnum2.value)">
            <h2>Calculator (-)</h2>
            <label>Enter First Number : </label>
            <input type = "number" id = "firstnum2" name = "firstnum2" required value = "30"><br><br>
            <label>Enter Second Number : </label>
            <input type = "number" id = "secondnum2" name = "secondnum2" required value = "10"><br><br>
            <label> Output : </label>
            <output name = "result" for = "firstnum2 secondnum2">20</output><br>
        </form>
        <hr>
        <form oninput = "result.value = parseInt(firstnum3.value) * parseInt(secondnum3.value)">
            <h2>Calculator (*)</h2>
            <label>Enter First Number : </label>
            <input type = "number" id = "firstnum3" name = "firstnum3" required value = "30"><br><br>
            <label>Enter Second Number : </label>
            <input type = "number" id = "secondnum3" name = "secondnum3" required value = "10"><br><br>
            <label> Output : </label>
            <output name = "result" for = "firstnum3 secondnum3">300</output><br>
        </form>
        <hr>
        <form oninput = "result.value = parseInt(firstnum4.value) / parseInt(secondnum4.value)">
            <h2>Calculator (/)</h2>
            <label>Enter First Number : </label>
            <input type = "number" id = "firstnum4" name = "firstnum4" required value = "30"><br><br>
            <label>Enter Second Number : </label>
            <input type = "number" id = "secondnum4" name = "secondnum4" required value = "10"><br><br>
            <label> Output : </label>
            <output name = "result" for = "firstnum4 secondnum4">3</output><br>
            <hr>
        </form>
    </div>
    <br>
    <div>
        <footer>
            <p>Copyright &copy; Interactive Form with Inline Calculator 2026</p>
        </footer>
    </div>
</body>
</html>
